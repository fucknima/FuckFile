- (void)browserFileTasksChanged:(NSNotification *)note
{
    (void)note;
    __weak typeof(self) weakSelf = self;
    dispatch_async(dispatch_get_main_queue(), ^{
        typeof(weakSelf) self = weakSelf;
        if (!self) return;
        BOOL affectsHere = NO;
        for (FFFileTask *task in FFFileTaskManager.sharedManager.tasks) {
            if (!task.destination.length || task.state == FFFileTaskStateQueued) continue;
            if ([task.destination isEqualToString:self.currentPath] ||
                [task.destination.stringByDeletingLastPathComponent isEqualToString:self.currentPath]) {
                affectsHere = YES;
                break;
            }
        }
        if (!affectsHere || self.pendingAutoReload) return;
        self.pendingAutoReload = YES;
        dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(0.8 * NSEC_PER_SEC)),
            dispatch_get_main_queue(), ^{
                typeof(weakSelf) self = weakSelf;
                if (!self) return;
                self.pendingAutoReload = NO;
                if (self.hasLoaded) [self reloadEntries];
            });
    });
}

- (void)browserProbeFinished:(NSNotification *)note
{
    (void)note;
    dispatch_async(dispatch_get_main_queue(), ^{ [self reloadEntries]; });
}

- (void)browserMCMLinksUpdated:(NSNotification *)note
{
    (void)note;
    if (![self.currentPath hasPrefix:MCMVirtualRoot()]) return;
    dispatch_async(dispatch_get_main_queue(), ^{ [self reloadEntries]; });
}

- (void)browserSettingsChanged:(NSNotification *)note
{
    (void)note;
    dispatch_async(dispatch_get_main_queue(), ^{
        self.showHiddenFiles = [NSUserDefaults.standardUserDefaults
            boolForKey:@"FFSettingsShowHiddenFiles"];
        if (self.moreItem) self.moreItem.menu = [self moreMenu];
        [self reloadEntries];
    });
}

- (void)browserContentSizeChanged:(NSNotification *)note
{
    (void)note;
    [self updateBreadcrumbVisibility];
    [self.collectionView.collectionViewLayout invalidateLayout];
}
