{
    NSString *query = [searchController.searchBar.text
        stringByTrimmingCharactersInSet:NSCharacterSet.whitespaceAndNewlineCharacterSet];
    if (!query.length) {
        [self.recursiveSearchService cancel];
        self.recursiveSearchGeneration++;
        self.recursiveSearchSeenPaths = nil;
        [self.pendingRecursiveSearchItems removeAllObjects];
        self.recursiveSearchRefreshScheduled = NO;
        self.searchText = nil;
        searchController.searchBar.prompt = nil;
        [self applyFilter];
        [self refreshVisibleContent];
        return;
    }

    [self.recursiveSearchService cancel];
    NSUInteger generation = ++self.recursiveSearchGeneration;
    self.searchText = query;
    [self.pendingRecursiveSearchItems removeAllObjects];
    self.recursiveSearchRefreshScheduled = NO;
    NSMutableSet<NSString *> *seen = [NSMutableSet set];
    self.recursiveSearchSeenPaths = seen;
    self.filteredEntries = [self immediateMatchesForQuery:query seen:seen];
    searchController.searchBar.prompt = @"正在搜索子文件夹…";
    [self refreshVisibleContent];

    __weak typeof(self) weakSelf = self;
    [self.recursiveSearchService startSearch:query underRoot:self.currentPath
        batch:^(NSArray<FFFoundItem *> *batch) {
            typeof(weakSelf) self = weakSelf;
            if (!self || generation != self.recursiveSearchGeneration) return;
            [self.pendingRecursiveSearchItems addObjectsFromArray:batch];
            [self scheduleRecursiveSearchFlushForGeneration:generation];
        } completion:^(BOOL finished) {
            (void)finished;
            typeof(weakSelf) self = weakSelf;
            if (!self || generation != self.recursiveSearchGeneration) return;
            [self flushRecursiveSearchItemsForGeneration:generation];
            FFSearchCompletionStatus status = self.recursiveSearchService.completionStatus;
            self.searchController.searchBar.prompt =
                (status == FFSearchCompletionStatusCompleted || status == FFSearchCompletionStatusCancelled)
                ? nil : self.recursiveSearchService.statusMessage;
            [self refreshVisibleContent];
        }];
