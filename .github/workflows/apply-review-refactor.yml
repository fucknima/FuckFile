- (void)saveWithCompletion:(void (^)(BOOL saved))completion
{
    if (self.saveInProgress || self.readOnlyMode) {
        if (completion) completion(NO);
        return;
    }
    self.saveInProgress = YES;
    [self setSaveEnabled:NO];

    NSString *text = self.editorView.text ?: @"";
    FFTextEncoding encoding = self.encoding;
    BOOL bom = self.hasBOM;
    if (self.encodingOverride)
        bom = (encoding == FFTextEncodingUTF16LE || encoding == FFTextEncodingUTF16BE ||
               encoding == FFTextEncodingUTF8BOM);
    FFLineEnding lineEnding = self.lineEnding;
    NSString *filePath = self.filePath.copy;
    __weak typeof(self) weakSelf = self;

    dispatch_async(dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0), ^{
        NSData *data = [FFTextCodec encodeString:text encoding:encoding bom:bom lineEnding:lineEnding];
        NSString *detail = nil;
        NSString *finalName = nil;
        NSString *parent = data ? [FFPathPolicy resolveParentForMutation:filePath
            finalName:&finalName errorMessage:&detail] : nil;
        NSString *target = parent.length ? [parent stringByAppendingPathComponent:finalName] : nil;
        NSError *writeError = nil;
        BOOL wrote = target.length && [data writeToFile:target options:NSDataWritingAtomic error:&writeError];
        dispatch_async(dispatch_get_main_queue(), ^{
            typeof(weakSelf) self = weakSelf;
            if (!self) return;
            self.saveInProgress = NO;
            if (!data) {
                [self flash:@"无法用所选编码编码此内容（存在无法表示的字符）。"];
                [self setSaveEnabled:YES];
                if (completion) completion(NO);
                return;
            }
            if (!parent.length) {
                FFLogTag(@"TextEditor", @"save REJECT path=%@ reason=%@", filePath,
                    detail ?: @"路径不合法");
                [self flash:[NSString stringWithFormat:@"无法保存：%@", detail ?: @"路径不合法"]];
                [self setSaveEnabled:YES];
                if (completion) completion(NO);
                return;
            }
            if (wrote) {
                BOOL stillSame = [self.editorView.text ?: @"" isEqualToString:text] &&
                    self.encoding == encoding && self.lineEnding == lineEnding;
                if (stillSame) {
                    self.changed = NO;
                    [self setSaveEnabled:NO];
                } else {
                    self.changed = YES;
                    [self setSaveEnabled:YES];
                }
                [self flash:@"已保存"];
                if (completion) completion(YES);
                return;
            }
            FFLogTag(@"TextEditor", @"save FAIL path=%@ error=%@", filePath, writeError);
            [self setSaveEnabled:YES];
            [self offerCopyOnFailure:data];
            if (completion) completion(NO);
        });
    });
}'''
