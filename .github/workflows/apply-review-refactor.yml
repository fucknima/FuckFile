          search_helpers = r'''
- (NSArray<FFEntry *> *)immediateMatchesForQuery:(NSString *)query
                                            seen:(NSMutableSet<NSString *> *)seen
{
    NSMutableArray<FFEntry *> *matches = [NSMutableArray array];
    for (FFEntry *entry in self.entries ?: @[]) {
        BOOL matched = FFBrowserSearchMatches(entry.displayName, query) ||
            FFBrowserSearchMatches(entry.name, query) ||
            FFBrowserSearchMatches(entry.containerIdentifier, query);
        if (!matched || ![self entry:entry matchesFilter:self.filterMode]) continue;
        NSString *key = entry.path.stringByStandardizingPath ?: entry.path;
        if (key.length && [seen containsObject:key]) continue;
        if (key.length) [seen addObject:key];
        [matches addObject:entry];
    }
    return matches;
}

- (void)flushRecursiveSearchItemsForGeneration:(NSUInteger)generation
{
    if (generation != self.recursiveSearchGeneration) return;
    self.recursiveSearchRefreshScheduled = NO;
    if (!self.pendingRecursiveSearchItems.count) return;
    NSArray<FFFoundItem *> *pending = self.pendingRecursiveSearchItems.copy;
    [self.pendingRecursiveSearchItems removeAllObjects];
    NSMutableArray<FFEntry *> *rows = [self.filteredEntries mutableCopy] ?: [NSMutableArray array];
    NSString *root = self.currentPath;
    for (FFFoundItem *found in pending) {
        NSString *key = found.path.stringByStandardizingPath ?: found.path;
        if (key.length && [self.recursiveSearchSeenPaths containsObject:key]) continue;
        if (key.length) [self.recursiveSearchSeenPaths addObject:key];
        FFEntry *entry = [FFEntry new];
        entry.name = found.name;
        entry.displayName = found.displayName.length ? found.displayName : found.name;
        entry.path = found.path;
        entry.isDirectory = found.isDirectory;
        entry.size = found.size;
        if (![self entry:entry matchesFilter:self.filterMode]) continue;
        NSString *relative = [found.path hasPrefix:root]
