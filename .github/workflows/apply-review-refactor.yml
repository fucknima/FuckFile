name: apply-review-refactor

on:
  push:
    branches:
      - codex/comprehensive-review-fixes

permissions:
  contents: write

concurrency:
  group: apply-review-refactor
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          ref: codex/comprehensive-review-fixes
          fetch-depth: 1

      - name: Apply deterministic source refactor
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              return text.replace(old, new, 1)

          def method_span(text, marker):
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f"method marker missing: {marker[:80]!r}")
              brace = text.find('{', start + len(marker))
              if brace < 0:
                  raise SystemExit(f"method opening brace missing: {marker[:80]!r}")
              depth = 0
              i = brace
              state = 'code'
              while i < len(text):
                  ch = text[i]
                  nxt = text[i+1] if i + 1 < len(text) else ''
                  if state == 'code':
                      if ch == '/' and nxt == '/': state = 'line'; i += 2; continue
                      if ch == '/' and nxt == '*': state = 'block'; i += 2; continue
                      if ch == '"': state = 'string'; i += 1; continue
                      if ch == "'": state = 'char'; i += 1; continue
                      if ch == '{': depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              return start, i + 1
                  elif state == 'line':
                      if ch == '\n': state = 'code'
                  elif state == 'block':
                      if ch == '*' and nxt == '/': state = 'code'; i += 2; continue
                  elif state in ('string', 'char'):
                      if ch == '\\': i += 2; continue
                      if (state == 'string' and ch == '"') or (state == 'char' and ch == "'"):
                          state = 'code'
                  i += 1
              raise SystemExit(f"method end missing: {marker[:80]!r}")

          def replace_method(text, marker, replacement):
              a, b = method_span(text, marker)
              return text[:a] + replacement.rstrip() + text[b:]

          # ------------------------------------------------------------------
          # Browser: fold all app-owned runtime patches into the real class.
          # ------------------------------------------------------------------
          p = Path('src/FFBrowserViewController.m')
          s = p.read_text()
          s = replace_once(s,
              '#import "FFViewerPickerViewController.h"\n',
              '#import "FFViewerPickerViewController.h"\n#import "FFFileIconProvider.h"\n#import "FFSearchService.h"\n',
              'browser imports')
          s = s.replace('UICollectionViewDelegateFlowLayout, ', 'UICollectionViewDelegate, ')

          s = replace_once(s,
              '@property(nonatomic) BOOL pendingAutoReload;\n@end',
              '''@property(nonatomic) BOOL pendingAutoReload;
@property(nonatomic, strong) FFSearchService *recursiveSearchService;
@property(nonatomic) NSUInteger recursiveSearchGeneration;
@property(nonatomic, strong) NSMutableSet<NSString *> *recursiveSearchSeenPaths;
@property(nonatomic, strong) NSMutableArray<FFFoundItem *> *pendingRecursiveSearchItems;
@property(nonatomic) BOOL recursiveSearchRefreshScheduled;
@end''',
              'browser private search state')

          helpers = r'''
static CGFloat FFBreadcrumbHeight(void)
{
    UIFont *font = [UIFont preferredFontForTextStyle:UIFontTextStyleCaption1];
    return MAX(32.0, ceil(font.lineHeight + 12.0));
}

static BOOL FFStoragePathIsInsideRoot(NSString *path, NSString *root)
{
    NSString *candidate = path.stringByStandardizingPath;
    NSString *base = root.stringByStandardizingPath;
    if (!candidate.length || !base.length) return NO;
    return [candidate isEqualToString:base] ||
        [candidate hasPrefix:[base stringByAppendingString:@"/"]];
}

static void FFCleanupLegacyGeneratedCachesAtStorageRoot(void)
{
    static dispatch_once_t onceToken;
    dispatch_once(&onceToken, ^{
        NSFileManager *fm = NSFileManager.defaultManager;
        NSString *root = FFStorageRootPath();
        NSString *legacyRoot = [root stringByAppendingPathComponent:@"Device Storage"];
        for (NSString *name in @[@"LSIdentifierCache.plist", @"LSGroupCache.plist"]) {
            [fm removeItemAtPath:[root stringByAppendingPathComponent:name] error:nil];
            [fm removeItemAtPath:[legacyRoot stringByAppendingPathComponent:name] error:nil];
        }
        if ([fm contentsOfDirectoryAtPath:legacyRoot error:nil].count == 0)
            [fm removeItemAtPath:legacyRoot error:nil];
    });
}

static BOOL FFBrowserSearchMatches(NSString *field, NSString *query)
{
    if (!field.length || !query.length) return NO;
    return [field rangeOfString:query options:(NSCaseInsensitiveSearch |
        NSDiacriticInsensitiveSearch | NSWidthInsensitiveSearch)].location != NSNotFound;
}

@interface FFStableGridCell : UICollectionViewCell
@property(nonatomic, strong) UIImageView *iconView;
@property(nonatomic, strong) UILabel *nameLabel;
@property(nonatomic, strong) UILabel *detailLabel;
@property(nonatomic, copy) NSString *representedPath;
