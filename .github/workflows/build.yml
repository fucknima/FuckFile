name: build-unsigned-ipa

on:
  push:
    branches:
      - main
      - build/grid-stability-final
  workflow_dispatch:

permissions:
  contents: write

# Only main pushes build automatically. Feature/other branches are built manually
# with Run workflow. Cancelled/failed runs never advance the successful-build counter.
concurrency:
  group: fuckfile-numbered-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          fetch-depth: 1

      - name: Resolve next successful build number
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin build-counter --depth=1
          CURRENT="$(git show FETCH_HEAD:BUILD_NUMBER | tr -d '[:space:]')"
          if ! [[ "$CURRENT" =~ ^[0-9]+$ ]]; then
            echo "Invalid BUILD_NUMBER on build-counter: $CURRENT" >&2
            exit 1
          fi
          NEXT=$((CURRENT + 1))
          echo "BUILD_NUMBER=$NEXT" >> "$GITHUB_ENV"
          echo "IPA_NAME=FuckFile-build-${NEXT}.ipa" >> "$GITHUB_ENV"

          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT" Info.plist
          if /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" ShareExtension/Info.plist >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT" ShareExtension/Info.plist
          else
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $NEXT" ShareExtension/Info.plist
          fi
          echo "Candidate successful build: $NEXT"

      - name: Install Theos
        run: |
          sudo mkdir -p /opt/theos
          sudo chown "$(whoami)" /opt/theos
          git clone --recursive https://github.com/theos/theos.git /opt/theos
          cd /opt/theos
          git checkout 5280bd038207e14f8bd76f5417aa2fe641c03228
          git submodule update --init --recursive
          curl -fL -o /tmp/ldid \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64
          chmod +x /tmp/ldid
          sudo mv /tmp/ldid /usr/local/bin/ldid
          ldid -v 2>&1 | head -1 || true

      - name: Self-check core logic (probe/codec)
        run: |
          clang -fobjc-arc -framework Foundation -lz -I src \
            tests/self_check.m src/FFContentProbe.m src/FFTextCodec.m \
            src/FFSearchSession.m src/FFLogger.m \
            -o /tmp/ff_selfcheck
          /tmp/ff_selfcheck

      - name: Swift bridge header sanity (pch of FuckFile-Bridging-Header.h)
        run: |
          xcrun --sdk iphoneos clang -fobjc-arc -c -x objective-c-header \
            -I src -I third_party/tree-sitter/include \
            FuckFile-Bridging-Header.h -o /tmp/ff_bridge.pch

      - name: Build app and share extension
        run: |
          set -euo pipefail
          export THEOS=/opt/theos
          make clean
          make

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Candidate build: ${BUILD_NUMBER}"

          APP="$(find .theos/obj -name 'FuckFile.app' -type d | head -1)"
          EXT_BUILD="$(find .theos/obj -name 'FuckFileShare.appex' -type d | head -1)"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "ERROR: FuckFile.app not found"; exit 1
          fi
          if [ -z "$EXT_BUILD" ] || [ ! -d "$EXT_BUILD" ]; then
            echo "ERROR: FuckFileShare.appex not found"; find .theos/obj -maxdepth 4 -type d; exit 1
          fi
          if [ ! -x "$EXT_BUILD/FuckFileShare" ]; then
            echo "ERROR: share extension executable missing"; find "$EXT_BUILD" -maxdepth 2 -type f -print; exit 1
          fi

          cp Info.plist "$APP/Info.plist"
          cp ShareExtension/Info.plist "$EXT_BUILD/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.apple.mobile.MobileHouseArrest" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable FuckFile" "$APP/Info.plist"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$BUILD_NUMBER" ] || exit 1
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$EXT_BUILD/Info.plist")" = "$BUILD_NUMBER" ] || exit 1
          plutil -lint "$APP/Info.plist"
          plutil -lint "$EXT_BUILD/Info.plist"
          plutil -lint FuckFile.entitlements
          plutil -lint ShareExtension/FuckFileShare.entitlements

          mkdir -p "$APP/Base.lproj"
          /usr/bin/ibtool --compile "$APP/Base.lproj/LaunchScreen.storyboardc" LaunchScreen.storyboard

          xcrun actool Assets.xcassets \
            third_party/runestone/0.5.2/Theme.xcassets \
            --compile "$APP" \
            --platform iphoneos \
            --minimum-deployment-target 15.0 \
            --app-icon AppIcon \
            --output-format human-readable-text \
            --output-partial-info-plist "$APP/icon-partial-info.plist"
          test -f "$APP/Assets.car"
          python3 -c "import plistlib,sys; a=plistlib.load(open(sys.argv[2],'rb')); b=plistlib.load(open(sys.argv[1],'rb')); b.update({'CFBundleIcons':a['CFBundleIcons']} if 'CFBundleIcons' in a else {}); plistlib.dump(b,open(sys.argv[1],'wb'))" "$APP/Info.plist" "$APP/icon-partial-info.plist"

          mkdir -p "$APP/Languages"
          for d in c cpp objc swift python javascript typescript tsx json html css bash yaml xml markdown sql; do
            SRC="third_party/tree-sitter-languages/$d/queries/highlights.scm"
            if [ ! -f "$SRC" ]; then
              SRC="third_party/tree-sitter-languages/typescript/$d/queries/highlights.scm"
            fi
            if [ -f "$SRC" ]; then
              mkdir -p "$APP/Languages/$d"
              cp "$SRC" "$APP/Languages/$d/highlights.scm"
            fi
          done
          test -f "$APP/Languages/c/highlights.scm"

          rm -rf "$APP/PlugIns/FuckFileShare.appex"
          mkdir -p "$APP/PlugIns"
          ditto "$EXT_BUILD" "$APP/PlugIns/FuckFileShare.appex"
          EXT="$APP/PlugIns/FuckFileShare.appex"

          [ "$(/usr/libexec/PlistBuddy -c 'Print :UIFileSharingEnabled' "$APP/Info.plist")" = "true" ] || exit 1
          [ "$(/usr/libexec/PlistBuddy -c 'Print :UISupportsDocumentBrowser' "$APP/Info.plist")" = "true" ] || exit 1
          [ "$(/usr/libexec/PlistBuddy -c 'Print :LSSupportsOpeningDocumentsInPlace' "$APP/Info.plist")" = "false" ] || exit 1
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSHandlerRank' "$APP/Info.plist")" = "Default" ] || exit 1
          [ "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist")" = "com.apple.share-services" ] || exit 1
          [ "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "$EXT/Info.plist")" = "FFShareViewController" ] || exit 1
          [ "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionAttributes:NSExtensionActivationRule:NSExtensionActivationSupportsFileWithMaxCount' "$EXT/Info.plist")" = "25" ] || exit 1

          file "$EXT/FuckFileShare"
          otool -l "$EXT/FuckFileShare" | grep -A3 LC_MAIN

          codesign --force -s - --entitlements ShareExtension/FuckFileShare.entitlements "$EXT"
          codesign --force -s - --entitlements FuckFile.entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          codesign -d --entitlements :- "$APP" > /tmp/app-entitlements.plist 2>/dev/null
          codesign -d --entitlements :- "$EXT" > /tmp/share-entitlements.plist 2>/dev/null
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' /tmp/app-entitlements.plist | grep -Fx 'group.com.apple.mobile.MobileHouseArrest'
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' /tmp/share-entitlements.plist | grep -Fx 'group.com.apple.mobile.MobileHouseArrest'

          rm -rf Payload "$IPA_NAME"
          mkdir -p Payload
          ditto "$APP" Payload/FuckFile.app
          zip -qry "$IPA_NAME" Payload
          test -f "$IPA_NAME"
          unzip -l "$IPA_NAME" | grep 'Payload/FuckFile.app/PlugIns/FuckFileShare.appex/FuckFileShare'
          echo "IPA: $(pwd)/$IPA_NAME ($(du -h "$IPA_NAME" | cut -f1))"

      - name: Upload build ${{ env.BUILD_NUMBER }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FuckFile-build-${{ env.BUILD_NUMBER }}
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error

      - name: Commit successful build number
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FuckFile Build Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf /tmp/ff-build-counter
          git fetch origin build-counter --depth=1
          git worktree add --detach /tmp/ff-build-counter FETCH_HEAD
          cd /tmp/ff-build-counter
          git checkout -B build-counter
          printf '%s\n' "$BUILD_NUMBER" > BUILD_NUMBER
          git add BUILD_NUMBER
          git commit -m "Build ${BUILD_NUMBER} succeeded"
          git push origin HEAD:build-counter
