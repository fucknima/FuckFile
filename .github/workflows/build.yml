name: build-unsigned-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          sudo mkdir -p /opt/theos
          sudo chown "$(whoami)" /opt/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git /opt/theos

      - name: Build
        run: |
          export THEOS=/opt/theos
          make clean
          make FINALPACKAGE=1

      - name: Package unsigned IPA
        run: |
          APP="$(find .theos -name 'FuckFile.app' -type d | head -1)"
          if [ -z "$APP" ]; then
            echo "FuckFile.app not found"
            exit 1
          fi
          # Strip any certificate-based signature down to ad-hoc so the
          # artifact can be re-signed locally (zsign / 爱思 / TrollStore etc).
          codesign --force -s - "$APP" || true
          rm -rf Payload FuckFile.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry FuckFile.ipa Payload
          echo "IPA: $(pwd)/FuckFile.ipa ($(du -h FuckFile.ipa | cut -f1))"
          ls -la Payload/FuckFile.app | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FuckFile-unsigned-ipa
          path: FuckFile.ipa
          if-no-files-found: error
