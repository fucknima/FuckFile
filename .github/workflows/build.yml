name: build-unsigned-ipa

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Install Theos
        run: |
          sudo mkdir -p /opt/theos
          sudo chown "$(whoami)" /opt/theos
          git clone --recursive https://github.com/theos/theos.git /opt/theos
          cd /opt/theos
          git checkout 5280bd038207e14f8bd76f5417aa2fe641c03228
          git submodule update --init --recursive
          curl -fL -o /tmp/ldid \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64
          chmod +x /tmp/ldid
          sudo mv /tmp/ldid /usr/local/bin/ldid
          ldid -v 2>&1 | head -1 || true

      - name: Build app and share extension
        run: |
          export THEOS=/opt/theos
          make clean
          make

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          echo "Branch: ${GITHUB_REF_NAME}"

          APP="$(find .theos/obj -name 'FuckFile.app' -type d | head -1)"
          EXT_BUILD="$(find .theos/obj -name 'FuckFileShare.appex' -type d | head -1)"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "ERROR: FuckFile.app not found"; exit 1
          fi
          if [ -z "$EXT_BUILD" ] || [ ! -d "$EXT_BUILD" ]; then
            echo "ERROR: FuckFileShare.appex not found"; find .theos/obj -maxdepth 4 -type d; exit 1
          fi
          if [ ! -x "$EXT_BUILD/FuckFileShare" ]; then
            echo "ERROR: share extension executable missing"; find "$EXT_BUILD" -maxdepth 2 -type f -print; exit 1
          fi

          # Theos compile output is normalized explicitly so the IPA never
          # depends on staging side effects.
          cp Info.plist "$APP/Info.plist"
          cp ShareExtension/Info.plist "$EXT_BUILD/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.apple.mobile.MobileHouseArrest" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable FuckFile" "$APP/Info.plist"
          plutil -lint "$APP/Info.plist"
          plutil -lint "$EXT_BUILD/Info.plist"

          mkdir -p "$APP/Base.lproj"
          /usr/bin/ibtool --compile "$APP/Base.lproj/LaunchScreen.storyboardc" LaunchScreen.storyboard

          xcrun actool Assets.xcassets \
            --compile "$APP" \
            --platform iphoneos \
            --minimum-deployment-target 15.0 \
            --app-icon AppIcon \
            --output-format human-readable-text \
            --output-partial-info-plist "$APP/icon-partial-info.plist"
          test -f "$APP/Assets.car"
          python3 -c "import plistlib,sys; a=plistlib.load(open(sys.argv[2],'rb')); b=plistlib.load(open(sys.argv[1],'rb')); b.update({'CFBundleIcons':a['CFBundleIcons']} if 'CFBundleIcons' in a else {}); plistlib.dump(b,open(sys.argv[1],'wb'))" "$APP/Info.plist" "$APP/icon-partial-info.plist"

          rm -rf "$APP/PlugIns/FuckFileShare.appex"
          mkdir -p "$APP/PlugIns"
          ditto "$EXT_BUILD" "$APP/PlugIns/FuckFileShare.appex"
          EXT="$APP/PlugIns/FuckFileShare.appex"

          echo "== LCSign-parity plist verification =="
          plutil -p "$APP/Info.plist"
          plutil -p "$EXT/Info.plist"

          [ "$(/usr/libexec/PlistBuddy -c 'Print :UIFileSharingEnabled' "$APP/Info.plist")" = "true" ] || exit 1
          [ "$(/usr/libexec/PlistBuddy -c 'Print :UISupportsDocumentBrowser' "$APP/Info.plist")" = "true" ] || exit 1
          [ "$(/usr/libexec/PlistBuddy -c 'Print :LSSupportsOpeningDocumentsInPlace' "$APP/Info.plist")" = "false" ] || exit 1
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSHandlerRank' "$APP/Info.plist")" = "Default" ] || exit 1
          [ "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist")" = "com.apple.share-services" ] || exit 1
          [ "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "$EXT/Info.plist")" = "FFShareViewController" ] || exit 1
          [ "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionAttributes:NSExtensionActivationRule:NSExtensionActivationSupportsFileWithMaxCount' "$EXT/Info.plist")" = "25" ] || exit 1

          echo "== Share extension Mach-O =="
          file "$EXT/FuckFileShare"
          otool -l "$EXT/FuckFileShare" | grep -A3 LC_MAIN

          # Nested code must be signed first; the containing app is signed last
          # so its CodeResources records the final appex signature.
          codesign --force -s - "$EXT"
          codesign --force -s - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          echo "== Embedded signatures/entitlements (diagnostic) =="
          codesign -d --entitlements :- "$APP" 2>/dev/null || true
          codesign -d --entitlements :- "$EXT" 2>/dev/null || true

          rm -rf Payload FuckFile.ipa
          mkdir -p Payload
          ditto "$APP" Payload/FuckFile.app
          zip -qry FuckFile.ipa Payload

          test -f FuckFile.ipa
          unzip -l FuckFile.ipa | grep 'Payload/FuckFile.app/PlugIns/FuckFileShare.appex/FuckFileShare'
          echo "IPA: $(pwd)/FuckFile.ipa ($(du -h FuckFile.ipa | cut -f1))"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FuckFile-unsigned-ipa
          path: FuckFile.ipa
          if-no-files-found: error
