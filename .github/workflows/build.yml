name: build-unsigned-ipa

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Install Theos
        run: |
          sudo mkdir -p /opt/theos
          sudo chown "$(whoami)" /opt/theos
          # Pinned to a specific commit so tooling never drifts.
          git clone --recursive https://github.com/theos/theos.git /opt/theos
          cd /opt/theos
          git checkout 5280bd038207e14f8bd76f5417aa2fe641c03228
          git submodule update --init --recursive
          # Pin ldid to a fixed release instead of brewing the latest.
          curl -fL -o /tmp/ldid \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64
          chmod +x /tmp/ldid
          sudo mv /tmp/ldid /usr/local/bin/ldid
          ldid -v 2>&1 | head -1 || true

      - name: Build
        run: |
          export THEOS=/opt/theos
          make clean
          make

      - name: Package unsigned IPA
        run: |
          echo "Branch: ${GITHUB_REF_NAME}"
          APP="$(find .theos/obj -name 'FuckFile.app' -type d | head -1)"
          if [ -z "$APP" ]; then
            echo "FuckFile.app not found under .theos/obj"
            find .theos -maxdepth 4 -type d | head -20
            exit 1
          fi
          # Theos 'make' (compile only) does not place Info.plist in the
          # .app bundle; inject the repo one and pin the critical fields.
          cp Info.plist "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.apple.mobile.MobileHouseArrest" "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable FuckFile" "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" "$APP/Info.plist" 2>/dev/null || true
          plutil -lint "$APP/Info.plist"
          # Compile a real launch storyboard: without one, sideloaded apps
          # fall back to legacy compatibility mode and get black bars on
          # modern iPhones (only the middle third of the screen renders).
          mkdir -p "$APP/Base.lproj"
          /usr/bin/ibtool --compile "$APP/Base.lproj/LaunchScreen.storyboardc" LaunchScreen.storyboard
          ls -la "$APP/Base.lproj"
          # Compile the app icon asset catalog (light + dark appearance).
          # actool writes Assets.car into the bundle; the Info.plist keys
          # (CFBundleIcons/AppIcon) are already in the repo plist.
          xcrun actool Assets.xcassets \
            --compile "$APP" \
            --platform iphoneos \
            --minimum-deployment-target 15.0 \
            --app-icon AppIcon \
            --output-format human-readable-text \
            --output-partial-info-plist "$APP/icon-partial-info.plist" \
            && ls -la "$APP/Assets.car" || exit 1
          # 合并 actool 生成的 CFBundleIcons（含暗色变体声明）进 Info.plist。
          python3 -c "import plistlib,sys; a=plistlib.load(open(sys.argv[2],'rb')); b=plistlib.load(open(sys.argv[1],'rb')); b.update({'CFBundleIcons':a['CFBundleIcons']} if 'CFBundleIcons' in a else {}); plistlib.dump(b,open(sys.argv[1],'wb')); print('merged CFBundleIcons')" "$APP/Info.plist" "$APP/icon-partial-info.plist"
          plutil -lint "$APP/Info.plist"
          # ---- Share Extension（theos appex.mk 编译，自动 -e _NSExtensionMain）----
          # theos 构建产物在 .theos/obj/FFShareExtension.appex，rsync 进主 app PlugIns。
          SHARE_APPEX="$APP/PlugIns/FFShareExtension.appex"
          if [ -d ".theos/obj/FFShareExtension.appex" ]; then
            rm -rf "$SHARE_APPEX"
            mkdir -p "$APP/PlugIns"
            rsync -a ".theos/obj/FFShareExtension.appex/" "$SHARE_APPEX/"
            echo "embedded theos appex into PlugIns"
          else
            # theos in-place fallback: 手动构建目录可能在 staging 区
            STAGED_APPEX=$(find .theos -maxdepth 4 -name "FFShareExtension.appex" -type d | head -1)
            if [ -n "$STAGED_APPEX" ]; then
              rm -rf "$SHARE_APPEX"
              mkdir -p "$APP/PlugIns"
              rsync -a "$STAGED_APPEX/" "$SHARE_APPEX/"
              echo "embedded staged appex: $STAGED_APPEX"
            fi
          fi
          if [ ! -d "$SHARE_APPEX" ]; then
            echo "ERROR: appex not built by theos (obj or staging missing)"
            find .theos -maxdepth 5 -name "*.appex" -o -name "*FFShare*" | head -20
            exit 1
          fi
          plutil -lint "$SHARE_APPEX/Info.plist"
          # 扩展签名：先 codesign 生成签名，再 ldid 注入 application-groups entitlement。
          codesign --force -s - "$SHARE_APPEX"
          /usr/local/bin/ldid -S Entitlements.plist "$SHARE_APPEX/FFShareExtension" || true
          # Strip any certificate-based signature down to ad-hoc; inject the
          # application-groups entitlement for the App Group bridge.
          # Fail loudly: a broken signature produces an unusable artifact.
          codesign --force -s - "$APP"
          /usr/local/bin/ldid -S Entitlements.plist "$APP/FuckFile" || true
          rm -rf Payload FuckFile.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry FuckFile.ipa Payload
          echo "IPA: $(pwd)/FuckFile.ipa ($(du -h FuckFile.ipa | cut -f1))"
          unzip -l FuckFile.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FuckFile-unsigned-ipa
          path: FuckFile.ipa
          if-no-files-found: error
