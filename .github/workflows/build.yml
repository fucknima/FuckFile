name: build-unsigned-ipa

on:
  push:
    branches:
      - main
      - codex/comprehensive-review-fixes
      - 无漏洞利用fuckfile
      - swift-fuckfile
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fuckfile-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          fetch-depth: 1

      - name: Resolve build identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" == "main" ]]; then
            git fetch origin build-counter --depth=1
            CURRENT="$(git show FETCH_HEAD:BUILD_NUMBER | tr -d '[:space:]')"
            if ! [[ "$CURRENT" =~ ^[0-9]+$ ]]; then
              echo "Invalid BUILD_NUMBER on build-counter: $CURRENT" >&2
              exit 1
            fi
            BUILD_NUMBER=$((CURRENT + 1))
            IPA_NAME="FuckFile-build-${BUILD_NUMBER}.ipa"
            NUMBERED_BUILD=true
          else
            BUILD_NUMBER=$((900000 + GITHUB_RUN_NUMBER))
            IPA_NAME="FuckFile-ci-${GITHUB_RUN_NUMBER}.ipa"
            NUMBERED_BUILD=false
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          echo "NUMBERED_BUILD=$NUMBERED_BUILD" >> "$GITHUB_ENV"

          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" Info.plist
          if /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" ShareExtension/Info.plist >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ShareExtension/Info.plist
          else
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" ShareExtension/Info.plist
          fi
          echo "Build identity: $BUILD_NUMBER numbered=$NUMBERED_BUILD"

      - name: Install Theos
        run: |
          sudo mkdir -p /opt/theos
          sudo chown "$(whoami)" /opt/theos
          git clone --recursive https://github.com/theos/theos.git /opt/theos
          cd /opt/theos
          git checkout 5280bd038207e14f8bd76f5417aa2fe641c03228
          git submodule update --init --recursive
          curl -fL -o /tmp/ldid \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64
          chmod +x /tmp/ldid
          sudo mv /tmp/ldid /usr/local/bin/ldid
          ldid -v 2>&1 | head -1 || true

      - name: Self-check core logic (probe/codec/search session)
        run: |
          clang -fobjc-arc -framework Foundation -lz -I src \
            tests/self_check.m src/FFContentProbe.m src/FFTextCodec.m \
            src/FFSearchSession.m src/FFLogger.m src/FFStorageEnvironment.m \
            src/FFTrashService.m src/FFBatchRename.m \
            -o /tmp/ff_selfcheck
          /tmp/ff_selfcheck

      - name: Review regression guards
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/FFSearchViewController.m
          test ! -e src/FFSearchViewController.h
          test ! -e src/FFHomeViewController.m
          ! grep -q 'FFSearchViewController' Makefile
          ! grep -q 'FFHomeViewController' Makefile
          ! grep -q -- '-Wno-format' Makefile
          ! grep -q -- '-Wno-incompatible-pointer-types' Makefile
          ! grep -q -- '-Wno-implicit-function-declaration' Makefile
          grep -q 'lstat(child.fileSystemRepresentation' src/FFSearchService.m
          grep -q 'FFResolvedPathIsInsideRoot' src/FFSearchService.m
          grep -q 'if (!showResult)' src/FFAppDelegate.m

          # 底栏只保留 文件/设置；收藏/最近/任务/回收站改为页面内入口。
          grep -q 'taskPill' src/FFRootTabBarController.m
          grep -q 'quickAccessBar' src/FFBrowserViewController.m
          grep -q 'FFTrashService' src/FFBrowserViewController.m
          grep -q 'batchRename' src/FFBrowserViewController.m
          # Swift 重写分支：App 目标只编译 Sources/*.swift，不再列 ObjC 源文件。
          grep -q 'Sources' Makefile
          ! grep -q 'removeItemsAtPaths' src/FFBrowserViewController.m

          # No sandbox-escape / container-access stack may come back.
          for removed in \
            src/MCMManager.m src/MCMBridge.m src/FFSystemAccessManager.m \
            src/FFAppDataRegistry.m src/FFAppDataLeaseManager.m \
            src/FFAppDataScanCoordinator.m src/FFAppDataVirtualPath.m \
            src/FFAppDataVirtualBrowser.m src/FFAppNames.m src/FFAppNameCatalog.h \
            src/FFOnlineAppNameResolver.m src/FFLSDiscovery.m src/FFLSStoreInventory.m \
            src/FFStorageCleaner.m src/FFStorageCleanerViewController.m \
            src/FFIPaInstallerViewController.m MCMIdentifiers.example.plist; do
            test ! -e "$removed" || { echo "ERROR: removed exploit file present: $removed" >&2; exit 1; }
          done
          ! grep -rq 'MobileHouseArrest' Makefile Info.plist ShareExtension Info.plist src FuckFile.entitlements ShareExtension/FuckFileShare.entitlements
          ! grep -rEq 'MCMManager|MCMBridge|FFSystemAccessManager|FFAppDataRegistry|FFAppDataVirtualPath|FFStorageCleaner|FFIPaInstallerViewController' src
          ! grep -q '@"ipa": @"installer"' src/FFFileAssociationService.m
          grep -q '@"ipa": @"archive"' src/FFFileAssociationService.m

          # The legacy Word reader and its runtime were removed: the unified
          # office-document viewer is the only DOCX path (ADR-020).
          for removed in \
            src/FFDocxViewerViewController.m src/FFDocxViewerViewController.h \
            scripts/prepare_docx_runtime.sh resources/docx/docx-host.js; do
            test ! -e "$removed" || { echo "ERROR: removed docx asset present: $removed" >&2; exit 1; }
          done
          ! grep -q 'FFDocxViewerViewController' Makefile src
          ! grep -q 'DocxAssets' Makefile .github/workflows/build.yml

          # Quick Look is preserve-first: unchanged previews must not refresh on
          # every foreground transition. It remains only a manual Office fallback.
          grep -q 'UIApplicationDidEnterBackgroundNotification' src/FFQuickLookViewController.m
          grep -q 'UIApplicationDidBecomeActiveNotification' src/FFQuickLookViewController.m
          grep -q 'if (!changed)' src/FFQuickLookViewController.m
          grep -q 'foreground preserved unchanged preview' src/FFQuickLookViewController.m
          grep -q 'refreshCurrentPreviewItem' src/FFQuickLookViewController.m

          # App-owned WebKit viewers recover only after the source changes or
          # WebContent is actually reclaimed; normal background return is lossless.
          grep -q 'webViewWebContentProcessDidTerminate' src/FFSpreadsheetViewController.m
          grep -q 'sourceChangedSinceBackground' src/FFSpreadsheetViewController.m
          grep -q 'pendingFailureMessage' src/FFSpreadsheetViewController.m
          grep -q 'webViewWebContentProcessDidTerminate' src/FFOfficeDocumentViewController.m
          grep -q 'sourceChangedSinceBackground' src/FFOfficeDocumentViewController.m
          grep -q 'pendingFailureMessage' src/FFOfficeDocumentViewController.m
          grep -q 'webViewWebContentProcessDidTerminate' src/FFWebViewerViewController.m
          grep -q 'needsForegroundRecovery' src/FFWebViewerViewController.m

          # Office formats default to app-owned readers; no Office family should
          # silently regress to Quick Look defaults.
          grep -q '@"doc": @"office-document"' src/FFFileAssociationService.m
          grep -q '@"pptx": @"office-document"' src/FFFileAssociationService.m
          grep -q '@"pages": @"office-document"' src/FFFileAssociationService.m
          grep -q '@"wps": @"office-document"' src/FFFileAssociationService.m
          grep -q '@"xlsx": @"spreadsheet"' src/FFFileAssociationService.m
          grep -q '@"docx": @"office-document"' src/FFFileAssociationService.m
          grep -q 'FFOfficeDocumentViewController' src/FFViewerRegistry.m
          # Swift 重写期间 App 目标不含 ObjC/Office runtime 接线；阶段 3 接回
          # 查看器与 Office 运行时后，再恢复这三条断言。
          test -f scripts/prepare_office_runtime.sh
          test -f resources/office/entry.js

          # Office/Word previews must open fit-to-width like Quick Look (no
          # horizontal clipping) and stop refitting once the user zooms.
          grep -q 'FFOfficeLayout' resources/office/fixed-layout.js
          grep -q 'fitDocumentToWidth' src/FFOfficeDocumentViewController.m
          grep -q 'FFOffice.fit' src/FFOfficeDocumentViewController.m
          grep -q 'NSURLErrorCancelled' src/FFOfficeDocumentViewController.m
          grep -q 'ff-search-input' resources/office/index.html
          grep -q 'buildSearchHits' resources/office/entry.js
          grep -q 'ff-page-slider' resources/office/index.html
          grep -q 'exportPDF' src/FFOfficeDocumentViewController.m
          grep -q 'FFViewerStateStore' src/FFOfficeDocumentViewController.m
          grep -q 'FFSpreadsheet.fit' src/FFSpreadsheetViewController.m
          grep -q 'fitToWidth' resources/univer/entry.js
          grep -q 'ff-search-input' resources/univer/index.html
          grep -q 'buildSheetSearchHits' resources/univer/entry.js
          grep -q 'style-xml.mjs' scripts/prepare_univer_runtime.sh
          grep -q 'buildStyleContext' resources/univer/entry.js
          grep -q 'registerSheetTap' resources/univer/entry.js
          grep -q 'toggleZoomForDoubleTap' resources/office/entry.js
          node tests/viewer_fit_check.js
          node tests/style_xml_check.mjs

      - name: Build app and share extension
        run: |
          set -euo pipefail
          export THEOS=/opt/theos

          # Generated grammars come from mixed Tree-sitter generator/runtime
          # revisions. Keep their known lexer-mode pointer warning local to
          # third-party generated C instead of weakening first-party ObjC.
          find third_party/tree-sitter-languages -type f \
            \( -name 'parser.c' -o -name 'scanner.c' \) -print0 | \
          while IFS= read -r -d '' file; do
            tmp="${file}.ffdiag"
            {
              echo '/* FF_GENERATED_GRAMMAR_DIAGNOSTICS */'
              echo '#if defined(__clang__)'
              echo '#pragma clang diagnostic ignored "-Wincompatible-pointer-types"'
              echo '#endif'
              cat "$file"
            } > "$tmp"
            mv "$tmp" "$file"
          done

          make clean
          make

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Build: ${BUILD_NUMBER}"

          # Theos leaves per-arch bundles next to the merged one; pick the
          # universal (fat) bundle explicitly instead of trusting find order.
          select_bundle() { # $1 = bundle dir name, $2 = executable name
            local fallback=""
            while IFS= read -r candidate; do
              local binary="$candidate/$2"
              [ -x "$binary" ] || continue
              if file "$binary" | grep -q 'universal binary'; then
                echo "$candidate"
                return 0
              fi
              [ -z "$fallback" ] && fallback="$candidate"
            done < <(find .theos/obj -type d -name "$1" | sort)
            if [ -n "$fallback" ]; then echo "$fallback"; fi
            return 0
          }
          APP="$(select_bundle FuckFile.app FuckFile)"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "ERROR: FuckFile.app not found"; exit 1
          fi
          # ARCHS=arm64 arm64e：thin bundle would silently drop older devices.
          for arch in arm64 arm64e; do
            lipo -archs "$APP/FuckFile" | tr ' ' '\n' | grep -Fxq "$arch" || {
              echo "ERROR: $APP/FuckFile is missing $arch"; exit 1;
            }
          done

          cp Info.plist "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.fucknima.fuckfile" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable FuckFile" "$APP/Info.plist"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$BUILD_NUMBER" ] || exit 1
          plutil -lint "$APP/Info.plist"
          plutil -lint FuckFile.entitlements

          mkdir -p "$APP/Base.lproj"
          /usr/bin/ibtool --compile "$APP/Base.lproj/LaunchScreen.storyboardc" LaunchScreen.storyboard

          xcrun actool Assets.xcassets \
            --compile "$APP" \
            --platform iphoneos \
            --minimum-deployment-target 16.0 \
            --app-icon AppIcon \
            --output-format human-readable-text \
            --output-partial-info-plist "$APP/icon-partial-info.plist"
          test -f "$APP/Assets.car"
          python3 -c "import plistlib,sys; a=plistlib.load(open(sys.argv[2],'rb')); b=plistlib.load(open(sys.argv[1],'rb')); b.update({k:v for k,v in a.items() if k.startswith('CFBundleIcons')}); plistlib.dump(b,open(sys.argv[1],'wb'))" "$APP/Info.plist" "$APP/icon-partial-info.plist"

          [ "$(/usr/libexec/PlistBuddy -c 'Print :UIFileSharingEnabled' "$APP/Info.plist")" = "true" ] || exit 1
          [ "$(/usr/libexec/PlistBuddy -c 'Print :UISupportsDocumentBrowser' "$APP/Info.plist")" = "true" ] || exit 1
          [ "$(/usr/libexec/PlistBuddy -c 'Print :LSSupportsOpeningDocumentsInPlace' "$APP/Info.plist")" = "false" ] || exit 1
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSHandlerRank' "$APP/Info.plist")" = "Default" ] || exit 1

          codesign --force -s - --entitlements FuckFile.entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          rm -rf Payload "$IPA_NAME"
          mkdir -p Payload
          ditto "$APP" Payload/FuckFile.app
          zip -qry "$IPA_NAME" Payload
          test -f "$IPA_NAME"
          unzip -l "$IPA_NAME" | grep 'Payload/FuckFile.app/FuckFile'
          echo "IPA: $(pwd)/$IPA_NAME ($(du -h "$IPA_NAME" | cut -f1))"

      - name: Upload build ${{ env.BUILD_NUMBER }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FuckFile-build-${{ env.BUILD_NUMBER }}
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error

      - name: Publish branch IPA download
        if: github.event_name == 'push' && (github.ref_name == 'codex/comprehensive-review-fixes' || github.ref_name == '无漏洞利用fuckfile' || github.ref_name == 'swift-fuckfile')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="review-ipa-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$IPA_NAME" \
            --target "$GITHUB_SHA" \
            --title "FuckFile CI ${GITHUB_RUN_NUMBER}" \
            --notes "Unsigned review build ${BUILD_NUMBER}" \
            --prerelease

      - name: Commit successful build number
        if: env.NUMBERED_BUILD == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FuckFile Build Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf /tmp/ff-build-counter
          git fetch origin build-counter --depth=1
          git worktree add --detach /tmp/ff-build-counter FETCH_HEAD
          cd /tmp/ff-build-counter
          git checkout -B build-counter
          printf '%s\n' "$BUILD_NUMBER" > BUILD_NUMBER
          git add BUILD_NUMBER
          git commit -m "Build ${BUILD_NUMBER} succeeded"
          git push origin HEAD:build-counter
