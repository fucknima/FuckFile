<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self' ffsheet:; object-src 'none'; frame-src 'none'">
<link rel="stylesheet" href="univer-host.css">
<link rel="stylesheet" href="host.css">
<title>Spreadsheet</title>
</head>
<body>
<div id="app" aria-label="电子表格只读查看区域"></div>
<div id="ff-searchbar" class="ff-hidden" role="search">
  <input id="ff-search-input" type="search" placeholder="在工作表中搜索" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="在工作表中搜索">
  <button id="ff-search-prev" type="button" aria-label="上一处">‹</button>
  <button id="ff-search-next" type="button" aria-label="下一处">›</button>
  <span id="ff-search-count" aria-live="polite"></span>
  <button id="ff-search-close" type="button" aria-label="关闭搜索">✕</button>
</div>
<div id="ff-status" role="status">
  <div class="ff-spinner"></div>
  <div id="ff-status-text">正在初始化电子表格引擎…</div>
</div>
<div id="ff-readonly">只读</div>
<div id="ff-sheet-menu" class="ff-hidden" role="menu"></div>
<div id="ff-viewerbar" role="toolbar" aria-label="电子表格查看工具栏">
  <button id="ff-sheet-button" class="ff-sheet-button" type="button" aria-expanded="false">工作表</button>
  <button id="ff-search-toggle" class="ff-tool-button" type="button" aria-label="查找">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="16.6" y1="16.6" x2="21" y2="21"></line></svg>
  </button>
  <div class="ff-toolbar-spacer"></div>
  <button id="ff-zoom-out" class="ff-tool-button" type="button" aria-label="缩小">−</button>
  <button id="ff-zoom-value" class="ff-zoom-value" type="button" aria-label="恢复百分之百缩放">100%</button>
  <button id="ff-zoom-in" class="ff-tool-button" type="button" aria-label="放大">＋</button>
</div>
<script src="xlsx.full.min.js"></script>
<script src="univer-host.js"></script>
</body>
</html>
